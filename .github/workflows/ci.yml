name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DISABLE_TELEMETRY: "1"

jobs:
  validate:
    name: Lint, catalog and install smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.x"
          cache: npm

      - name: Install dev dependencies (pinned skills CLI + yaml)
        run: npm ci --ignore-scripts

      - name: Lint skills
        run: npm run lint

      - name: README catalog is up to date
        run: npm run catalog:check

      - name: Agent instruction files match AGENTS.md
        run: npm run agents:check

      - name: Smoke install for every agent target
        run: npm run smoke
