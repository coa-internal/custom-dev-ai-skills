openapi: 3.0.3
info:
  title: Example City API
  version: 1.0.0
  description: >-
    Starter API for City of Asheville services. Replace this description, the example
    service-requests resource and the contact details with your own.
  contact:
    name: "<TEAM NAME>"
servers:
  - url: http://localhost:8080
    description: Local development server
tags:
  - name: health
    description: Service health for monitoring.
  - name: service-requests
    description: Example resource showing City conventions. Replace with your own resources.

# Default: every operation requires AWS IAM (SigV4). Override per operation with `security: []`
# for public endpoints. Terraform turns this into API Gateway IAM authorization at deploy time.
security:
  - aws_iam: []

paths:
  /v1/health:
    get:
      operationId: getHealth
      tags: [health]
      summary: Check service health
      description: Returns 200 when the service is running. Used by monitoring and the Lambda Web Adapter readiness check.
      security: []
      responses:
        "200":
          description: Service is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /v1/service-requests:
    get:
      operationId: listServiceRequests
      tags: [service-requests]
      summary: List service requests
      description: Returns service requests, newest first, one page at a time. Follow `next_cursor` to get the next page.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of service requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRequestPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/service-requests/{service_request_id}:
    parameters:
      - name: service_request_id
        in: path
        required: true
        description: Service request identifier.
        schema:
          type: string
          pattern: "^sr-[0-9]{6}$"
          example: sr-000123
    get:
      operationId: getServiceRequest
      tags: [service-requests]
      summary: Get a service request
      description: Returns one service request by its identifier.
      responses:
        "200":
          description: The service request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    aws_iam:
      type: apiKey
      in: header
      name: Authorization
      description: >-
        AWS Signature Version 4. Callers sign requests with IAM credentials that allow
        execute-api:Invoke on this API. Enforced by API Gateway, not by the application.

  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from a previous page's `next_cursor`. Omit for the first page.
      schema:
        type: string
        maxLength: 512

  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    ServiceRequest:
      type: object
      additionalProperties: false
      required: [service_request_id, request_type, status, created_at, updated_at]
      properties:
        service_request_id:
          type: string
          pattern: "^sr-[0-9]{6}$"
          example: sr-000123
        request_type:
          type: string
          description: Category of the request.
          example: pothole
        status:
          type: string
          enum: [open, in_progress, closed]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ServiceRequestPage:
      type: object
      additionalProperties: false
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ServiceRequest"
        next_cursor:
          type: string
          nullable: true
          description: Cursor for the next page, or null when there are no more items.

    Problem:
      type: object
      description: RFC 9457 Problem Details.
      required: [type, title, status]
      properties:
        type:
          type: string
          description: URI reference identifying the problem type.
          example: about:blank
        title:
          type: string
          example: Bad Request
        status:
          type: integer
          example: 400
        detail:
          type: string
        instance:
          type: string
          description: Request path the problem occurred on.
        errors:
          type: array
          description: Field-level validation errors (extension member).
          items:
            type: object
            required: [message]
            properties:
              path:
                type: string
              message:
                type: string

  responses:
    BadRequest:
      description: The request was invalid.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: The resource was not found.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalError:
      description: An unexpected error occurred.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
